<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demand Dashboard - Order Drops by Day</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* Custom styles matching your audit dashboard theme overrides */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a; /* Slate 900 dark mode base */
            color: #f8fafc;
        }
        .card {
            background-color: #1e293b; /* Slate 800 card background */
            border: 1px solid #334155;
            border-radius: 0.5rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .custom-dropdown {
            background-color: #1e293b;
            border: 1px solid #475569;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="border-b border-slate-700 bg-slate-900/80 backdrop-blur px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="h-8 w-8 bg-blue-600 rounded flex items-center justify-center font-bold text-white">D</div>
            <h1 class="text-xl font-semibold tracking-tight">Demand Dashboard <span class="text-sm text-slate-400 font-normal">| Order Drops by Day</span></h1>
        </div>
        
        <div class="flex items-center gap-4 ml-auto">
            <div class="flex items-center gap-2">
                <label for="excel-file" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded cursor-pointer transition">
                    Import Excel
                </label>
                <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" class="hidden" />
            </div>

            <div class="relative">
                <button id="dateFilterBtn" class="custom-dropdown text-sm py-2 px-4 rounded flex items-center gap-2 hover:bg-slate-700 text-slate-200">
                    <span>Filter Dates (All)</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="dateDropdownContainer" class="hidden absolute right-0 mt-2 w-64 custom-dropdown rounded shadow-xl p-3 z-50 max-h-60 overflow-y-auto">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-2 mb-2 text-xs">
                        <button onclick="toggleAllDates(true)" class="text-blue-400 hover:underline">Select All</button>
                        <button onclick="toggleAllDates(false)" class="text-slate-400 hover:underline">Clear</button>
                    </div>
                    <div id="dateCheckboxes" class="flex flex-col gap-2 text-sm text-slate-300">
                        </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 p-6 max-w-[1600px] w-full mx-auto space-y-6">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="card p-4">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Units Volume</h3>
                <p id="stat-total-units" class="text-2xl font-bold mt-1 text-blue-400">0</p>
            </div>
            <div class="card p-4">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Orders Handled</h3>
                <p id="stat-total-orders" class="text-2xl font-bold mt-1 text-emerald-400">0</p>
            </div>
            <div class="card p-4">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Active Tracked Customers</h3>
                <p id="stat-total-customers" class="text-2xl font-bold mt-1 text-purple-400">0</p>
            </div>
        </div>

        <div id="customer-grid" class="grid grid-cols-1 xl:grid-cols-2 gap-6">
            </div>
    </main>

    <div id="drilldownModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-4xl rounded-lg shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                <div>
                    <h2 id="modalCustomerName" class="text-lg font-bold text-white">Customer Details</h2>
                    <p id="modalCustomerSub" class="text-xs text-slate-400"></p>
                </div>
                <button onclick="closeDrilldown()" class="text-slate-400 hover:text-white text-xl p-1">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 bg-slate-900/50">
                <div class="h-[400px] w-full">
                    <canvas id="drilldownChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Endpoint Configuration for your Google App Script Sync Interface
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-akv_D7f_qLfyIjsB3ht1Pz2-gSrV_vOyk97F7GmUS9oDxOphb5A6yH_uLkY4ZvxhQw/exec";

        let masterDataset = [];
        let uniqueDates = [];
        let selectedDates = [];
        let chartInstances = {};
        let modalChartInstance = null;

        document.getElementById('excel-file').addEventListener('change', handleFileImport);
        document.getElementById('dateFilterBtn').addEventListener('click', () => {
            document.getElementById('dateDropdownContainer').classList.toggle('hidden');
        });

        // Initialize UI and pull cloud records on page startup
        window.addEventListener('DOMContentLoaded', fetchExistingData);

        async function fetchExistingData() {
            if (GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE")) {
                console.warn("Google Apps Script URL is blank. Displaying local engine mode demo data.");
                loadDemoData();
                return;
            }
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                const data = await res.json();
                masterDataset = data;
                processAndRender();
            } catch(e) {
                console.error("Error connecting to Google sheet database: ", e);
            }
        }

        function loadDemoData() {
            // Placeholder dataset mimicking structural framework mapping
            masterDataset = [
                { customer: "ABLETON", customerId: "411372", releaseDate: "2026-05-18", hourDrop: "08", qty: 45, lines: 1 },
                { customer: "ABLETON", customerId: "411372", releaseDate: "2026-05-19", hourDrop: "14", qty: 120, lines: 2 },
                { customer: "LIBBEY INC.", customerId: "411379", releaseDate: "2026-05-18", hourDrop: "10", qty: 300, lines: 5 },
                { customer: "LIBBEY INC.", customerId: "411379", releaseDate: "2026-05-19", hourDrop: "22", qty: 15, lines: 1 }
            ];
            processAndRender();
        }

        function handleFileImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const rawJson = XLSX.utils.sheet_to_json(worksheet);

                // Map Excel data dictionary payload to internal key architecture
                const cleanedImport = rawJson.map(row => ({
                    customer: row.vendor_name ? String(row.vendor_name).trim() : 'Unknown',
                    customerId: row.vendor_code ? String(row.vendor_code).trim() : '',
                    releaseDate: row.release_date ? String(row.release_date).split('T')[0] : '',
                    hourDrop: row.hour_drop ? String(row.hour_drop).padStart(2, '0') : '00',
                    qty: parseInt(row.qty_ordered) || 0,
                    lines: 1 // Track individual row dropped count metrics
                }));

                // Push payload upstream via API to sync across warehouse workstations
                syncWithGoogleSheets(cleanedImport);
            };
            reader.readAsArrayBuffer(file);
        }

        async function syncWithGoogleSheets(newRows) {
            if (GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE")) {
                masterDataset = [...masterDataset, ...newRows];
                processAndRender();
                return;
            }

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newRows)
                });
                const updatedData = await response.json();
                masterDataset = updatedData;
                processAndRender();
            } catch (err) {
                console.error("Cloud storage sync failure: ", err);
                // Fallback graceful save local update if network is drops out
                masterDataset = [...masterDataset, ...newRows];
                processAndRender();
            }
        }

        function processAndRender() {
            // Find unique dates for filter dropdown panel layout
            const dateSet = new Set(masterDataset.map(d => d.releaseDate));
            uniqueDates = Array.from(dateSet).sort();
            
            if (selectedDates.length === 0) {
                selectedDates = [...uniqueDates];
            }

            renderDateFilters();
            renderDashboardVisuals();
        }

        function renderDateFilters() {
            const container = document.getElementById('dateCheckboxes');
            container.innerHTML = '';
            
            uniqueDates.forEach(date => {
                const isChecked = selectedDates.includes(date);
                const wrapper = document.createElement('label');
                wrapper.className = "flex items-center gap-2 cursor-pointer hover:text-white";
                wrapper.innerHTML = `
                    <input type="checkbox" value="${date}" ${isChecked ? 'checked' : ''} class="rounded text-blue-600 focus:ring-0 bg-slate-700 border-slate-600">
                    <span>${date}</span>
                `;
                wrapper.querySelector('input').addEventListener('change', handleDateSelectionChange);
                container.appendChild(wrapper);
            });
            
            updateFilterButtonText();
        }

        function handleDateSelectionChange() {
            const checkboxes = document.querySelectorAll('#dateCheckboxes input');
            selectedDates = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
            updateFilterButtonText();
            renderDashboardVisuals();
        }

        function toggleAllDates(selectTrue) {
            const checkboxes = document.querySelectorAll('#dateCheckboxes input');
            checkboxes.forEach(cb => cb.checked = selectTrue);
            selectedDates = selectTrue ? [...uniqueDates] : [];
            updateFilterButtonText();
            renderDashboardVisuals();
        }

        function updateFilterButtonText() {
            const btn = document.querySelector('#dateFilterBtn span');
            if (selectedDates.length === uniqueDates.length) btn.textContent = "Filter Dates (All)";
            else if (selectedDates.length === 0) btn.textContent = "Filter Dates (None)";
            else btn.textContent = `Filtered (${selectedDates.length} Days)`;
        }

        function renderDashboardVisuals() {
            // Filter records down to target selection matrix bounds
            const filteredData = masterDataset.filter(d => selectedDates.includes(d.releaseDate));

            // Compute global quick statistics metrics text cards
            let globalUnits = 0;
            let globalOrders = 0;
            const uniqueCusts = new Set();

            // Group by Customer and Date records
            const groupings = {};

            filteredData.forEach(row => {
                globalUnits += row.qty;
                globalOrders += row.lines;
                uniqueCusts.add(row.customer);

                if (!groupings[row.customer]) {
                    groupings[row.customer] = {
                        id: row.customerId,
                        dates: {}
                    };
                }
                if (!groupings[row.customer].dates[row.releaseDate]) {
                    groupings[row.customer].dates[row.releaseDate] = { qty: 0, orders: 0 };
                }
                groupings[row.customer].dates[row.releaseDate].qty += row.qty;
                groupings[row.customer].dates[row.releaseDate].orders += row.lines;
            });

            document.getElementById('stat-total-units').textContent = globalUnits.toLocaleString();
            document.getElementById('stat-total-orders').textContent = globalOrders.toLocaleString();
            document.getElementById('stat-total-customers').textContent = uniqueCusts.size;

            const gridContainer = document.getElementById('customer-grid');
            
            // Clean dynamic structures safely before recreation loop
            Object.keys(chartInstances).forEach(k => chartInstances[k].destroy());
            chartInstances = {};
            gridContainer.innerHTML = '';

            // Map and plot active elements inside system loops
            Object.keys(groupings).sort().forEach((customerName, index) => {
                const customerData = groupings[customerName];
                
                // Build Card Dom Shell Element
                const card = document.createElement('div');
                card.className = "card p-4 flex flex-col cursor-pointer";
                card.setAttribute('onclick', `openDrilldown('${customerName.replace(/'/g, "\\'")}')`);
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h2 class="text-base font-bold tracking-tight text-white">${customerName}</h2>
                            <p class="text-xs text-slate-400">Account ID: ${customerData.id}</p>
                        </div>
                        <span class="text-xs text-blue-400 hover:underline">View Hourly Drops</span>
                    </div>
                    <div class="h-48 w-full mt-auto">
                        <canvas id="chart-cust-${index}"></canvas>
                    </div>
                `;
                gridContainer.appendChild(card);

                // Prepare chart structures sorting linear chronological axis coordinates
                const labels = [...selectedDates].sort();
                const unitDataArray = labels.map(lbl => customerData.dates[lbl]?.qty || 0);
                const orderDataArray = labels.map(lbl => customerData.dates[lbl]?.orders || 0);

                const ctx = document.getElementById(`chart-cust-${index}`).getContext('2d');
                
                // Instantiate clean dual axis graph visualization configuration arrays
                chartInstances[customerName] = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Units Ordered',
                                data: unitDataArray,
                                backgroundColor: 'rgba(59, 130, 246, 0.75)', // Light theme matching focus highlight
                                borderColor: '#3b82f6',
                                yAxisID: 'yUnits',
                                order: 2
                            },
                            {
                                label: 'Orders Dropped',
                                data: orderDataArray,
                                type: 'line',
                                borderColor: '#10b981', // Emerald tracking overlay metrics line accent
                                borderWidth: 2,
                                pointBackgroundColor: '#10b981',
                                fill: false,
                                yAxisID: 'yOrders',
                                order: 1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } },
                            yUnits: { position: 'left', title: { display: true, text: 'Units', color: '#94a3b8', font: { size: 10 } }, ticks: { color: '#94a3b8' }, grid: { color: 'rgba(51, 65, 85, 0.5)' } },
                            yOrders: { position: 'right', title: { display: true, text: 'Orders', color: '#94a3b8', font: { size: 10 } }, ticks: { color: '#94a3b8' }, grid: { display: false } }
                        }
                    }
                });
            });
        }

        function openDrilldown(customerName) {
            const matchedRows = masterDataset.filter(d => d.customer === customerName && selectedDates.includes(d.releaseDate));
            const customerMeta = masterDataset.find(d => d.customer === customerName) || { customerId: 'N/A' };
            
            document.getElementById('modalCustomerName').textContent = customerName;
            document.getElementById('modalCustomerSub').textContent = `Customer ID: ${customerMeta.customerId} | Hourly Drop Load Run Summary Profile`;
            document.getElementById('drilldownModal').classList.remove('hidden');

            // Set up hourly 24 loop array container
            const hourlyUnits = Array(24).fill(0);
            const hourlyOrders = Array(24).fill(0);

            matchedRows.forEach(row => {
                const hourIndex = parseInt(row.hourDrop);
                if (hourIndex >= 0 && hourIndex < 24) {
                    hourlyUnits[hourIndex] += row.qty;
                    hourlyOrders[hourIndex] += row.lines;
                }
            });

            const hourlyLabels = Array.from({length: 24}, (_, i) => `${String(i).padStart(2, '0')}:00`);

            if (modalChartInstance) modalChartInstance.destroy();

            const ctx = document.getElementById('drilldownChart').getContext('2d');
            modalChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: hourlyLabels,
                    datasets: [
                        {
                            label: 'Units Distributed',
                            data: hourlyUnits,
                            backgroundColor: 'rgba(147, 51, 234, 0.7)', // Purple accent structure layout elements
                            borderColor: '#a855f7',
                            yAxisID: 'yU'
                        },
                        {
                            label: 'Volume Counts (Orders)',
                            data: hourlyOrders,
                            type: 'line',
                            borderColor: '#f59e0b', // Amber line profiles overlay metric summary highlights
                            borderWidth: 2,
                            yAxisID: 'yO'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(51, 65, 85, 0.4)' } },
                        yU: { position: 'left', title: { display: true, text: 'Units Summary Metrics Count', color: '#94a3b8' }, ticks: { color: '#94a3b8' } },
                        yO: { position: 'right', title: { display: true, text: 'Order Release Counts', color: '#94a3b8' }, ticks: { color: '#94a3b8' }, grid: { display: false } }
                    }
                }
            });
        }

        function closeDrilldown() {
            document.getElementById('drilldownModal').classList.add('hidden');
        }
    </script>
</body>
</html>
